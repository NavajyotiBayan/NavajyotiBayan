name: Sync Pinned Projects

on:
  # Runs every midnight in India (IST = UTC+5:30).
  # 18:30 UTC = 00:00 IST.
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate pinned project cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: NavajyotiBayan
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from html import escape

          username = os.environ["USERNAME"]

          query = """
          query($login: String!) {
            user(login: $login) {
              pinnedItems(first: 6, types: REPOSITORY) {
                nodes {
                  ... on Repository {
                    name
                    description
                    url
                    primaryLanguage { name }
                    stargazerCount
                    forkCount
                    isPrivate
                    isArchived
                  }
                }
              }
            }
          }
          """

          result = subprocess.run(
              [
                  "gh", "api", "graphql",
                  "-f", f"query={query}",
                  "-f", f"login={username}"
              ],
              check=True,
              capture_output=True,
              text=True
          )

          data = json.loads(result.stdout)
          repos = data["data"]["user"]["pinnedItems"]["nodes"]

          # GitHub profiles can pin up to six repositories.
          # Render them as a 3-column HTML table for a card-like layout.
          cards = []

          for repo in repos:
              name = escape(repo["name"])
              description = escape(repo["description"] or "A project by Navajyoti Bayan.")
              url = escape(repo["url"], quote=True)
              language = escape((repo["primaryLanguage"] or {}).get("name", "Code"))
              stars = repo["stargazerCount"]
              forks = repo["forkCount"]

              archived = " · Archived" if repo["isArchived"] else ""

              card = f"""
          <td width="33%" valign="top">

          <h3>▣ {name}</h3>

          <p>{description}</p>

          <p>
          <code>{language}</code>
          </p>

          <p>
          ⭐ {stars} &nbsp; · &nbsp; 🍴 {forks}{archived}
          </p>

          <p>
          <a href="{url}"><b>View repository →</b></a>
          </p>

          </td>
          """

              cards.append(card)

          if not cards:
              generated = """
          <table>
          <tr>
          <td align="center">
          <b>No pinned repositories yet.</b>
          </td>
          </tr>
          </table>
          """
          else:
              rows = []
              for i in range(0, len(cards), 3):
                  row = cards[i:i + 3]
                  while len(row) < 3:
                      row.append('<td width="33%" valign="top"></td>')
                  rows.append("<tr>\n" + "\n".join(row) + "\n</tr>")

              generated = "<table>\n" + "\n".join(rows) + "\n</table>"

          readme_path = Path("README.md")
          text = readme_path.read_text(encoding="utf-8")

          start = "<!-- PINNED:START -->"
          end = "<!-- PINNED:END -->"

          if start not in text or end not in text:
              raise SystemExit("Pinned project markers were not found in README.md")

          before = text.split(start, 1)[0]
          after = text.split(end, 1)[1]

          replacement = (
              f"{start}\n"
              f"<!-- Automatically generated from your GitHub pinned repositories. -->\n\n"
              f"{generated}\n\n"
              f"{end}"
          )

          readme_path.write_text(
              before + replacement + after,
              encoding="utf-8"
          )
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "Pinned projects are already up to date."
            exit 0
          fi

          git commit -m "chore: sync pinned project cards"
          git push
