<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1420" viewBox="0 0 1200 1420">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b10"/>
    <stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .window { fill:url(#bg); stroke:#30363d; stroke-width:2; }
    .bar { fill:#11161d; }
    .line { stroke:#26313b; stroke-width:1; }
    .green { fill:#39d353; }
    .greenStroke { stroke:#39d353; }
    .muted { fill:#7d8590; }
    .white { fill:#f0f6fc; }
    .cyan { fill:#58a6ff; }
    .purple { fill:#bc8cff; }
    .prompt { fill:#39d353; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:19px; font-weight:700; }
    .command { fill:#f0f6fc; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:19px; font-weight:700; }
    .title { fill:#f0f6fc; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:30px; font-weight:800; }
    .subtitle { fill:#8b949e; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:17px; }
    .label { fill:#39d353; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:14px; font-weight:800; letter-spacing:1.5px; }
    .body { fill:#c9d1d9; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:16px; }
    .small { fill:#8b949e; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; }
    .project { fill:#f0f6fc; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:20px; font-weight:800; }
    .desc { fill:#8b949e; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:14px; }
    .meta { fill:#7ee787; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; font-weight:700; }
    .card { fill:#0b1016; stroke:#26313b; stroke-width:1.5; }
    a:hover .card { stroke:#39d353; }
    .chip { fill:#101820; stroke:#30363d; stroke-width:1; }
    .chipText { fill:#8b949e; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; }
  </style>
</defs>

<rect width="1200" height="1420" rx="18" class="window"/>

<!-- terminal title bar -->
<rect x="0" y="0" width="1200" height="64" rx="18" class="bar"/>
<rect x="0" y="42" width="1200" height="22" class="bar"/>
<circle cx="28" cy="32" r="7" fill="#ff5f56"/>
<circle cx="52" cy="32" r="7" fill="#ffbd2e"/>
<circle cx="76" cy="32" r="7" fill="#27c93f"/>
<text x="600" y="38" text-anchor="middle" class="subtitle">NavajyotiBayan — developer terminal</text>

<!-- header -->
